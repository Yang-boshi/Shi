<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - /{{ slug }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Analytics</h1>
            <p>Tracking data for <code>/{{ slug }}</code></p>
            <p class="original-url">→ {{ original_url }}</p>
        </header>

        <main>
            <div class="stats-header">
                <div class="stat-card total">
                    <h3>Total Clicks</h3>
                    <span id="totalClicks" class="stat-number">0</span>
                </div>
                <div class="stat-card">
                    <a href="/" class="btn-back">← Back to Home</a>
                </div>
            </div>

            <div class="charts-grid">
                <section class="chart-section">
                    <h3>Clicks Over Time</h3>
                    <canvas id="clicksChart"></canvas>
                </section>

                <section class="chart-section">
                    <h3>Browsers</h3>
                    <canvas id="browsersChart"></canvas>
                </section>
            </div>

            <div class="tables-grid">
                <section class="table-section">
                    <h3>Top Referrers</h3>
                    <table id="referrersTable">
                        <thead>
                            <tr>
                                <th>Referrer</th>
                                <th>Clicks</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>

                <section class="table-section">
                    <h3>Recent Clicks</h3>
                    <table id="clicksTable">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>IP</th>
                                <th>Referrer</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <script>
        const SLUG = '{{ slug }}';
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
